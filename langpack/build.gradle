plugins {
    id 'com.android.application'
}

// Версия данных в пакетах. Клавиатура сравнивает её с каталогом в своих
// assets и так узнаёт об обновлении, не выходя в сеть. Версия у каждого языка
// своя, и отдельная у пакета языка и у пакетов-кешей: кеш весит сотни
// мегабайт, и предлагать перекачивать его из-за правки в раскладке было бы
// издевательством над трафиком.
//
// Единственное место, где перечислены языки: отсюда берутся и флейворы сборки,
// и версии, и названия, и коды языков для манифеста. Скрипты в tools/ читают
// этот же список. Новый язык добавляется одной записью — см. langpack/README.md.
//
//   title  — как язык называется в каталоге на экране установки;
//   extra  — язык не входит в каталог самой клавиатуры и выкладывается
//            отдельно: пользователь ставит APK вручную, а клавиатура находит
//            пакет сама. Так живут языки помимо основных четырёх;
//   langs  — коды языков, которые пакет объявляет клавиатуре (украинский
//            пользуется русским словарём, поэтому едет вместе с ним);
//   base   — версия самого языкового пакета;
//   idx    — версия пакетов с готовыми кешами.
//
ext {
    packLanguages = [
        en: [title: "English",  langs: "en",    base: [code: 2, name: "1.1.0"], idx: [code: 1, name: "1.0.0"]],
        fr: [title: "Français", langs: "fr",    base: [code: 9, name: "1.5.2"], idx: [code: 6, name: "1.4.0"]],
        de: [title: "Deutsch",  langs: "de",    base: [code: 9, name: "1.5.2"], idx: [code: 6, name: "1.4.0"]],
        ru: [title: "Русский",  langs: "ru,uk", base: [code: 8, name: "1.3.2"], idx: [code: 5, name: "1.2.0"]],
        it: [title: "Italiano", langs: "it",    extra: true,
             base: [code: 4, name: "1.1.2"], idx: [code: 1, name: "1.0.0"]],
        es: [title: "Español",  langs: "es",    extra: true,
             base: [code: 2, name: "1.0.1"], idx: [code: 1, name: "1.0.0"]],
    ]
}

android {
    signingConfigs {
        release {
            storeFile file('/data/@SIGNING-KEYS/keystore2.jks')
            storePassword 'qwerty'
            keyAlias 'key0'
            keyPassword 'qwerty'
        }
    }

    lintOptions {
        disable 'ExpiredTargetSdkVersion'
    }

    compileSdkVersion 30

    // .cdb клавиатура открывает через openFd и маппит прямо из APK пакета,
    // поэтому он обязан лежать несжатым — иначе openFd его не отдаст.
    //
    // .ssnd так не читается: индекс распаковывается в папку приложения и
    // отображается уже оттуда. Несжатым он раздувал пакет вчетверо (17 МБ
    // против 4.5 на кеше в 35 тысяч слов) без всякой пользы.
    aaptOptions {
        noCompress '.cdb'
    }

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 27
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    /*
     * Два измерения: язык и содержимое.
     *
     * Пакет языка везёт раскладки, словарь текстом, биграммы и перевод — это
     * десятки мегабайт и нужно всем. Готовые индексы вынесены отдельно: они
     * весят больше самого пакета и нужны лишь тем, кто не хочет ждать сборку.
     * Ставятся независимо, поэтому размер выбирается без перекачивания данных.
     */
    flavorDimensions "lang", "content"
    productFlavors {
        // Языки заводятся из packLanguages: второй список рано или поздно
        // разошёлся бы с первым, и разницу было бы видно только по тому, что
        // пакет не собрался.
        project.ext.packLanguages.each { code, info ->
            create(code) { dimension "lang" }
        }

        base {
            dimension "content"
        }
        idx150 {
            dimension "content"
        }
        idx300 {
            dimension "content"
        }
        idxfull {
            dimension "content"
        }
    }

    applicationVariants.all { variant ->
        def lang = variant.productFlavors.find { it.dimension == "lang" }.name
        def content = variant.productFlavors.find { it.dimension == "content" }.name
        def suffix = content == "base" ? "" : "." + content
        def info = project.ext.packLanguages[lang]
        def version = info[content == "base" ? "base" : "idx"]

        variant.mergedFlavor.applicationId = "com.ai10.k12kb.lang." + lang + suffix
        // versionCode на mergedFlavor задавать нельзя — только на выходах варианта
        variant.outputs.all {
            versionCodeOverride = version.code
            versionNameOverride = version.name
        }
        variant.mergedFlavor.manifestPlaceholders = [
                packLanguages: info.langs,
                packLabel    : "K12KB " + lang.toUpperCase()
                        + (content == "base" ? "" : " " + content.replace("idx", "dict "))
        ]
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            // Имя без версии: ссылка на пакет в релизе GitHub должна быть
            // постоянной, а версия видна в самом APK и в каталоге.
            outputFileName = "K12KB-${variant.flavorName}.apk"
        }
    }
}
