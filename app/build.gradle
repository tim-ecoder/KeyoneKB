plugins {
    id 'com.android.application'
}



android {
    signingConfigs {
        debug {
            storeFile file('d:\\Programming\\keystores\\keystore2.jks')
            storePassword 'qwerty'
            keyAlias 'key0'
            keyPassword 'qwerty'
        }
        release {
            storeFile file('d:\\Programming\\keystores\\keystore2.jks')
            storePassword 'qwerty'
            keyAlias 'key0'
            keyPassword 'qwerty'
        }
    }

    lintOptions {
        disable 'ExpiredTargetSdkVersion'
    }

    compileSdkVersion 30

    aaptOptions {
        noCompress '.cdb'
    }

    defaultConfig {
        applicationId "com.ai10.k12kb"
        minSdkVersion 26
        targetSdkVersion 27

        //TODO: ---- Меняем versionCode, versionName каждый публичный выкат даже для тестеров ----
        // В номере билда build X.Y X<10 Y<10
        // иначе versionCode станет пятизначным, возврат потом к 4 знакам потребует сносить приложение т.к. ОС не дает откатывать
        versionCode 3008
        versionName "v3.2a"
        //TODO: ----------------------------

        /**
         * На этапе разработки, чтобы видеть между билдами какие функции менялись
         * -RC6-sr6-ckp11v22-gm23-sp12-nm22
         *
         * RC6 - Release candidate
         *
         * sr6 - Speech recognition
         * ckp - Core key press
         * cc - Core customizable
         * gm - Gesture movement
         * sp - Search plugins
         * nm - Navigation mode
         * jsp - javascript patching
         * uhsp - unihertz slim|pocket api >=28
         * osk - on-screen-keyboard
         * tgh - telegram hack
         * ts - toast
         * uht - unihertz titan (big)
         */

        //testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        signingConfig signingConfigs.debug
    }
    sourceSets {
        devRelease {
            res.srcDirs += 'src/dev/res'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            // versionName у dev несёт суффикс -dev, поэтому apk основной и
            // параллельной сборки не перезаписывают друг друга.
            outputFileName = "K12KB-${variant.versionName}.apk"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
        /**
         * Сборка для параллельной установки рядом с основной клавиатурой.
         * Отдельный applicationId, поэтому Android считает её другим
         * приложением: свои настройки, своя запись в списке клавиатур и в
         * спецвозможностях, отдельный каталог на sdcard.
         *
         * Собирать: gradlew assembleDev
         */
        dev {
            initWith debug
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            signingConfig signingConfigs.debug
            debuggable true
            matchingFallbacks = ['debug']
        }
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        /**
         * То же параллельное приложение, что и dev, но собранное как release:
         * minify, без debuggable, логи вырезаны R8. Нужно, чтобы тестировать
         * рядом с основной клавиатурой ровно тот код, который уедет в релиз.
         *
         * Ресурсы берёт из src/dev — иначе имя, authority провайдера и каталог
         * на sdcard совпали бы с основной сборкой.
         *
         * Собирать: gradlew assembleDevRelease
         */
        devRelease {
            initWith release
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            signingConfig signingConfigs.release
            matchingFallbacks = ['release']
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    //TODO: Иначе release версия не собирается
    lintOptions {
        abortOnError false
    }

}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.1.0'
    //implementation 'com.android.support.constraint:constraint-layout:1.1.0'
    implementation 'com.google.code.gson:gson:2.8.7'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.0'
    //implementation 'com.pes.materialcolorpicker:library:1.2.5'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.3'
    implementation 'com.faendir.rhino:rhino-android:1.6.0'
    //implementation "com.github.yukuku:ambilwarna:2.0.1" // source included in project
    //implementation "com.github.skydoves:colorpickerview:2.3.0"

}